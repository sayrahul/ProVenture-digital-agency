<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport"/>
<title>Client Portal Login | ProVenture Digital Agency</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Outfit:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>
<!-- CSS -->
<link href="custom/css/default-20252e34.css?v=112" rel="stylesheet" type="text/css">
<link href="custom/css/proventure-custom.css" rel="stylesheet" type="text/css"/>
<style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            position: relative;
            overflow: hidden;
        }
        
        .login-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(0, 172, 223, 0.1) 0%, transparent 50%);
            z-index: 0;
        }
        
        .login-card {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 1;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .login-logo {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: #1C1E20;
            text-decoration: none;
            display: block;
            margin-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }
        
        .form-control {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.3s ease;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--pv-primary, #00ACDF);
        }
        
        .btn-block {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
        }
        
        .login-footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.9rem;
            color: #666;
        }
        
        .login-footer a {
            color: var(--pv-primary, #00ACDF);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</link></head>
<body>
<div class="login-wrapper">
<div class="login-bg"></div>
<div class="login-card pv-glass-card">
<div class="login-header">
<a class="login-logo" href="index.html">ProVenture</a>
<p>Welcome back! Please login to your account.</p>
</div>
<form>
<div class="form-group">
<label class="form-label">Email Address</label>
<input class="form-control" placeholder="name@company.com" type="email"/>
</div>
<div class="form-group">
<label class="form-label">Password</label>
<input class="form-control" placeholder="••••••••" type="password"/>
</div>
<div class="form-group" style="display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem;">
<label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
<input type="checkbox"/> Remember me
                    </label>
<a href="#" style="color: #666; text-decoration: none;">Forgot password?</a>
</div>
<button class="btn btn-primary pv-btn-primary btn-block" type="submit">Sign In</button>
</form>
<div class="login-footer">
                Don't have an account? <a href="contact.html">Contact Support</a>
</div>
</div>
</div>
<!-- Scripts -->
<script src="custom/js/proventure-custom.js"></script>
</body>
</html>
