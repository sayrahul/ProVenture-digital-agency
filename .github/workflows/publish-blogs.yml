name: Automated SEO Blog Publisher

on:
  schedule:
    # Runs every Tuesday and Friday at 03:30 UTC (09:00 AM IST)
    - cron: '30 3 * * 2,5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  publish-blogs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Blog Publisher
        run: node scripts/publish.js

      - name: Commit and Push Changes if Published
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/ sitemap.xml blog.html
          if git diff --staged --quiet; then
            echo "No new blog posts released today."
          else
            git commit -m "Auto-publish: Scheduled SEO Blog Posts [skip ci]"
            git push origin main
          fi
